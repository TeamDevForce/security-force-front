<main>
  <div class="container">
    <section class="side-options">
      <div class="logo-container">
        <img src="/assets/svg/icons/logo1-security-force.svg" alt="">
      </div>

      <div class="btn-list">
        <button class="button-hover">
          <img src="/assets/svg/icons/icon-login.svg" alt="">
          Logins
        </button>
        <button class="button-hover font-weight">
          <img src="/assets/svg/icons/icon-favoritos.svg" alt="">
          Favoritos
        </button>
      </div>

      <div class="add-category">
        <div class="input-add-category">
          <button class="category-list">
            <img src="/assets/svg/icons/add-category-icon.svg" alt="">
            <span>Categorias</span>
          </button>
          <button (click)="AddCategory()" class="add-category-btn">+</button>
        </div>
      </div>

      <!-- LISTA DE CATEGORIAS -->
      <ul #categoriesList cdkDropList (cdkDropListDropped)="drop($event)">
        <li *ngFor="let category of categories; let i = index" cdkDrag>
          <div class="color-circle" [style.backgroundColor]="category.color"></div>
          {{ category.title }}
          <ng-template cdkDragPreview>
        <li class="template-preview">
          <div class="color-circle-preview" [style.backgroundColor]="category.color"></div>
          {{ category.title }}
        </li>
        </ng-template>
        </li>
      </ul>

      <app-select-category (keyup)="closeSelectCategory($event)" (newCategoryEmiter)="categoryReceived($event)"
        *ngIf="colorSelectorActive"></app-select-category>

      <div class="container-config">
        <span class="config">
          <img src="/assets/svg/icons/config-icon.svg" alt="">
          Configurações
        </span>
      </div>
    </section>
    <section class="side-list">

      <div class="side-logins">
        <div class="input-container padding-80">
          <label for="seach">
            <img src="/assets/svg/icons/icon-seach.svg" alt="">
          </label>
          <input id="seach" type="text" placeholder="Buscar">
        </div>

        <div class="cards-content">
          <div #itemCard class="item" *ngFor="let item of usuario.credenciais" (click)="itemSelected(item)"
            [ngClass]="{'selected': currentCredencial === item }">
            <div>
              <img src="/assets/svg/icons/icon-tabela.svg" alt="">
            </div>
            <div>
              <h2 class="title"> {{ item.nome }} </h2>
              <p class="email"> {{ item.usuario }} </p>
            </div>
          </div>
        </div>

        <div class="container-add-button padding-80">
          <button class="add-button">
            <img src="/assets/svg/icons/icon-add.svg" alt="">
            Adicionar
          </button>
        </div>
      </div>
      <div class="logins-content">
        <app-layout-tabela-dados *ngIf="tableActive" [credencial]="currentCredencial"></app-layout-tabela-dados>
      </div>

    </section>
  </div>
</main>
